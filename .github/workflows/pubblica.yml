name: Aggiorna dati OSM e pubblica

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # ogni notte aggiorna dati e orari

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica i dati del Molo Beverello da OpenStreetMap
        run: |
          python scripts/fetch_osm.py || echo "Dati non aggiornati, uso la copia esistente"
          python scripts/fetch_poi.py || echo "Luoghi non aggiornati, uso la copia esistente"
          python scripts/fetch_gtfs.py || echo "Orari ANM non aggiornati, uso la copia esistente"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Controllo qualità degli orari (validatore ufficiale MobilityData)
        continue-on-error: true
        run: |
          URL=$(curl -s https://api.github.com/repos/MobilityData/gtfs-validator/releases/latest | python3 -c "import json,sys; r=json.load(sys.stdin); print(next(a['browser_download_url'] for a in r['assets'] if a['name'].endswith('-cli.jar')))")
          export VALIDATOR_VERSION=$(basename "$URL")
          curl -sL "$URL" -o /tmp/gtfs-validator-cli.jar
          python scripts/valida_gtfs.py
      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Aggiorna dati OpenStreetMap del Beverello" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
